version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: careintel_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careintel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/careintel_db
      PROJECT_NAME: "CareIntel AI - Healthcare Intelligence"
      API_V1_STR: "/api/v1"
      ENVIRONMENT: "production"
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173", "*"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careintel_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8000/api/v1"
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
